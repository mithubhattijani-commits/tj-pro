name: Build TJ Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          df -h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21: JDK 17 triggered an unrelated instant
          # "deleted Android v1 embedding" failure at flutter
          # startup on the TJ Editor source line, while JDK 21 builds
          # reached Gradle normally.
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android local properties
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Install NDK for whisper_ggml_plus
        # The whisper.cpp native build pins NDK 29.0.13113456; the runner ships only
        # r28c, and Gradle cannot auto-install 29 because its SDK
        # license is not accepted on the runner. Accept licenses and
        # install it explicitly before the build. Also try installing
        # the Android 37 platform: rtmp_streaming 2.1.1 requires
        # compileSdk 37+ and the runner may not ship that platform.
        # The platform install is NON-FATAL (|| true).
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "ndk;29.0.13113456"
          "$SDKMANAGER" "platforms;android-37" || echo "NOTE: platforms;android-37 not in sdkmanager repo; Gradle will try auto-download"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-3[4567]|ndk;" || true
      - name: Decode signing keystore
        # TJ Pro day-1 stable key (fresh keystore, never the Aman/TJ key).
        # Secrets: KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_PASSWORD.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/tjpro.keystore
      - name: Build debug APK (keystore-signed, uncompressed)
        # DEBUG ONLY. No --split-per-abi, no shrinking, no compression:
        # an uncompressed build is mandatory (a compressed build
        # previously crashed on the user's phone). One universal APK:
        # the stable release link and the single updater manifest URL
        # both require one file.
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: flutter build apk --debug
      - name: Verify APK
        env:
          EXPECTED_SIGNER_SHA256: "1bdc8c53ba6e5bbb0ea3d6063475ab7e07550bbadbcbd51de19b879604589b37"
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-debug.apk
          ls -la "$APK"
          md5sum "$APK"
          unzip -t "$APK" | tail -3
          AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | head -1)
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -1)
          "$AAPT2" dump badging "$APK" > badging.txt
          cat badging.txt
          grep -F "package: name='com.tjpro.app' versionCode='1' versionName='1.0.0'" badging.txt
          grep -F "sdkVersion:'24'" badging.txt
          grep -F "targetSdkVersion:'36'" badging.txt
          grep -F "application-label:'TJ Pro'" badging.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" certs.txt
          echo "VERIFY OK: package/version/label/SDKs/signer all match TJ Pro day-1 key"
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: build/app/outputs/flutter-apk/app-debug.apk
          name: tj-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
