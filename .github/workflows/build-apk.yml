name: Build TJ Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          df -h
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
      - name: Prepare Android local properties
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Install NDK for whisper_ggml_plus
        run: |
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "ndk;29.0.13113456"
          "$SDKMANAGER" "platforms;android-37" || echo "NOTE: platforms;android-37 not in sdkmanager repo; Gradle will try auto-download"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-3[4567]|ndk;" || true
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/tjpro.keystore
      - name: Build debug APKs (keystore-signed, uncompressed, split per ABI)
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build apk --debug --split-per-abi --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Verify APKs
        env:
          EXPECTED_SIGNER_SHA256: "1bdc8c53ba6e5bbb0ea3d6063475ab7e07550bbadbcbd51de19b879604589b37"
        run: |
          set -e
          AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | head -1)
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -1)
          verify_one() {
            APK="$1"
            EXPECTED_CODE="$2"
            ls -la "$APK"
            md5sum "$APK"
            unzip -t "$APK" | tail -3
            "$AAPT2" dump badging "$APK" > badging.txt
            cat badging.txt
            grep -F "package: name='com.tjpro.app' versionCode='$EXPECTED_CODE' versionName='1.5.2'" badging.txt
            grep -F "sdkVersion:'24'" badging.txt
            grep -F "targetSdkVersion:'36'" badging.txt
            grep -F "application-label:'TJ Pro'" badging.txt
            "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
            ACTUAL_DIGEST=$(grep "Signer #1 certificate SHA-256 digest" certs.txt | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if [ "$ACTUAL_DIGEST" != "$EXPECTED_SIGNER_SHA256" ]; then echo "SIGNER MISMATCH on $APK: got $ACTUAL_DIGEST want $EXPECTED_SIGNER_SHA256"; exit 1; fi
            echo "VERIFY OK: $APK versionCode=$EXPECTED_CODE versionName=1.5.2 signer matches TJ Pro day-1 key"
          }
          verify_one build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk 1016
          verify_one build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk 2016
          verify_one build/app/outputs/flutter-apk/app-x86_64-debug.apk 4016
          echo "VERIFY OK: all 3 split APKs match package/version/SDKs/signer"
      - name: Upload APKs to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "Latest Build" --notes "Automated build from ${{ github.sha }}" 2>/dev/null || true
          gh release upload latest build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk --clobber
          gh release upload latest build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk --clobber
          gh release upload latest build/app/outputs/flutter-apk/app-x86_64-debug.apk --clobber
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tj-pro-debug-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error
