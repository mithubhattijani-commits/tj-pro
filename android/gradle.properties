org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

org.gradle.daemon=false

# TJ Pro v2: third-party plugin modules pin different Java targets
# (rtmp_streaming 17, mlkit_commons 11) while Kotlin 2.4 defaults its
# target to the JDK (21), so strict JVM-target validation fails the
# release build module by module. Downgrading the check to a warning
# unblocks the build; the mixed bytecode is fine for AGP 9.4's D8/R8,
# and the plugin modules' own upstream validation builds the same way.
# (Forcing one global Kotlin target was tried and is WRONG here: it
# fixed rtmp_streaming but broke mlkit_commons in the other direction.)
kotlin.jvm.target.validation.mode=warning
