name: tj_pro
description: "TJ Pro — free offline photo and video editor for Android."
publish_to: 'none'
version: 1.9.0+27

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  video_player: ^2.14.1
  file_picker: ^13.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  gal: ^2.3.3
  ffmpeg_kit_flutter_new: ^4.6.7
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_subject_segmentation: ^0.2.1
  google_mlkit_selfie_segmentation: ^0.12.1
  # google_mobile_ads REMOVED (one-build, defect #4): the decided
  # ads system is Unity Ads only — see unity_ads_plugin below.
  # Premium unlocks are COINS ONLY (v1.3.0, §8): rewarded ads exist
  # solely to earn coins via the Coins screen.
  unity_ads_plugin: ^0.5.0
  url_launcher: ^6.2.5
  whisper_ggml_plus: ^1.5.0
  package_info_plus: ^10.2.2
  # Build 9 (v1.7.0): device model + Android version for the
  # automatic crash reports (point #5) — read once, fail-soft,
  # 'unknown' when the platform channel is unavailable.
  device_info_plus: ^13.3.0
  open_filex: ^4.0.0
  # v2 Live Studio: dual RTMP publish (Facebook + YouTube at once).
  # NOTE: the plugin's "Android 2.2" is its NATIVE release line, not
  # the Dart package version — the Dart package is 2.1.x (2.1.0 added
  # multi-streaming, 2.1.1 fixed front-camera reset). ^2.2.0 resolves
  # to nothing on pub.dev (first build failed on exactly this).
  rtmp_streaming: ^2.1.0
  # v2 Live Studio: stream keys live ONLY in the secure store.
  # v10 (not v9): v9's windows dep pins win32 ^5, which conflicts
  # with package_info_plus 10.x (win32 ^6) and fails pub get; v10
  # also drops the Kotlin Gradle Plugin application that AGP 9
  # rejects. Fresh install here, so no v9 cipher migration concern.
  flutter_secure_storage: ^10.0.0
  google_fonts: ^6.3.1
  flutter_tts: ^4.2.3
  # News Studio (v1): Gemini voiceover goes through the Nigraan TTS proxy
  # (see lib/services/gemini_voice_service.dart). No `http` before this.
  http: ^1.2.0
  share_plus: ^13.3.1
  google_mlkit_translation: ^0.15.1
  # News Studio v1 — Login + Coins track (Magic Box pattern):
  # Supabase Auth (Google + email) + server coin ledger, Google
  # native sign-in, and the local coin-balance cache. Versions match
  # the verified Magic Box (audio-box) pubspec.
  supabase_flutter: ^2.9.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.3
  # v1.4.0 AI tools: on-device ONNX inference for the downloadable
  # model packs (MI-GAN remove, BiRefNet/MODNet matting, Real-ESRGAN,
  # Depth Anything bokeh, fast-neural-style) — models are NEVER
  # bundled, they download via ModelPackService (see
  # lib/services/model_pack_service.dart).
  onnxruntime: ^1.4.1
  # v1.4.0 Urdu auto captions: sherpa-onnx offline recognizer running
  # the Shruti Urdu Moonshine pack (downloadable, not bundled).
  sherpa_onnx: ^1.12.40
  # v1.4.0: microphone recording for the audio tools / voice features.
  record: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Build 5 follow-up (v1.5.7): generates the native splash resources
  # below (dev-only tool — nothing of it ships in the app).
  flutter_native_splash: ^2.4.8

# Build 5 follow-up (v1.5.7): the splash screen IS the user's own
# Nigraan TV poster (assets/splash_poster.png — the generation
# source for the native splash below; since Build 6 / v1.5.8 it
# is ALSO listed under flutter.assets for the in-app SplashGate).
# Android <=11: the poster fills the launch window (gravity fill)
# over the poster's deep blue (#040F30, its dark-blue median).
# Android 12+ (Build 7, v1.5.9): the system splash icon is a fully
# TRANSPARENT image (assets/splash_blank.png) on the same deep
# blue — the OS shows NO icon at all, only the plain #040F30
# background, until the in-app SplashGate paints the full-screen
# poster. (In v1.5.7/v1.5.8 the poster was the android_12 image,
# which the OS renders small and centred — the user saw a small
# icon instead of his poster.)
# Build 8 (v1.6.0): the bundled poster asset IS the user's
# canonical poster (branding-2026-11-24/splash-poster-canonical
# .jpg, converted losslessly to PNG for this tool), and the
# splash colour is now the poster's OWN sampled edge colour,
# #030E3F (mean of the canonical poster's top-strip and
# bottom-strip medians — its edges are not uniform: bright swoosh
# top corners, deep-navy bottom; the deep-navy family dominates).
# Native splash, SplashGate background and the gate's letterbox
# bands all use this one colour, so native -> gate -> home reads
# as one continuous poster appearing. The gate itself now shows
# the poster CONTAIN-fit (never cropped) and can take the poster
# from the remote config (splash_poster_url) — see main.dart.
# Regenerate after changing this:
#   flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#030E3F"
  image: assets/splash_poster.png
  android_gravity: fill
  fullscreen: true
  android: true
  ios: false
  web: false
  android_12:
    image: assets/splash_blank.png
    color: "#030E3F"

flutter:
  uses-material-design: true
  assets:
    - assets/luts/teal_orange.cube
    - assets/luts/vintage.cube
    - assets/luts/noir.cube
    - assets/luts/golden.cube
    - assets/luts/cool_night.cube
    - assets/jaani_ad_banner.jpg
    # Build 5 (v1.5.7): the Home hero — the user's own Nigraan TV
    # banner artwork, cropped from his home reference image; the
    # hero shows THIS image (never a drawn replacement).
    - assets/hero_nigraan_banner.jpg
    # Build 6 (v1.5.8): the splash poster is ALSO bundled as a
    # regular asset — the in-app SplashGate shows it full-screen
    # (the Android 12+ OS splash can only show it icon-sized).
    # The flutter_native_splash config below still uses the same
    # file as its generation source for the native splash.
    - assets/splash_poster.png
    # News Studio (v1) assets — BUNDLED ONLY IF SMALL (user order
    # 20 Nov 2026: keep the app as small as possible).
    # - Chroma-key backgrounds (~318 KB total, 1280x960): bundled.
    - assets/backgrounds/newsroom.jpg
    - assets/backgrounds/studio_desk.jpg
    # News Studio v1.2.0 — built-in starter content (user-supplied
    # 21 Nov 2026): two selectable video intro templates + four
    # copyright-free news background-music tracks. All optional in
    # the pickers; the Online Store carries the growing catalogue.
    - assets/templates/intro_studio.mp4
    - assets/templates/intro_globe.mp4
    # v1.3.0 (§9 Final-template parity, criterion 8): the REAL 10 s
    # Nigraan channel intro ships WITH the app so a Final-template
    # export always has it (the on-demand URL stays empty). The
    # binary is uploaded separately — this entry names its path.
    - assets/templates/nigraan_intro.mp4
    # v1.3.0 (demo v4, user-declared FINAL 22 Nov 2026): the
    # user's green-screen rotating-cube logo VIDEO — the Final
    # template's logo in export (chromakeyed) — plus its keyed
    # first frame, shown as a still in the preview. Both binaries
    # are uploaded separately — these entries name their paths.
    - assets/templates/nigraan_logo_gs.mp4
    - assets/templates/nigraan_logo_gs_frame.png
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/music/news_music_1.mp3
    - assets/music/news_music_2.mp3
    - assets/music/news_music_3.mp3
    - assets/music/news_music_4.mp3
  # NO bundled Kasheeda font, NO bundled intro video — both are heavy
  # (12.6 MB TTF + 1.4 MB mp4) and are downloaded ON DEMAND instead
  # (see lib/services/asset_download_service.dart): the font loads via
  # FontLoader from the cached file, the intro downloads on first use.
  # URLs come from AppConfig (kasheedaFontUrl / nigraanIntroUrl) — the
  # files are hosted at release time, never hardcoded here.
  # No bundled assets in v2: the caption model (~75 MB) used to be
  # downloaded by CI into assets/models/ and bundled, which is a big
  # part of the old size. It now downloads once on first captions use
  # (see lib/services/caption_service.dart) and is never an asset.


